# TODO: https://ask-ell.atlassian.net/browse/ASK-3

networks:
  default:
    driver: "bridge"

secrets:
  ask:
    file: secrets.json

volumes:
  source:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $PWD

services:
  front-end:
    image: node:20.19.2
    networks:
    - default
    user: node
    working_dir: /home/node/workspace
    volumes:
    - source:/home/node/workspace
    ports:
    - "4321:4321"
    secrets:
    - ask
    command: npm run start:dev -- --host